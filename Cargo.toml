[package]
name = "cargo-binlist"
description = "List all installed binaries with cargo and their versions"
repository = "https://github.com/bircni/cargo-binlist"
version = "2.0.0"
authors = ["bircni"]
edition = "2024"
rust-version = "1.88"
license = "MIT"
readme = "README.md"
categories = ["development-tools::cargo-plugins"]
keywords = ["cargo", "binlist", "version", "plugin", "cli"]
exclude = [".github/*", ".vscode/*", "scripts/*", "cliff.toml", "deny.toml", "typos.toml"]

[dependencies]
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
clap-verbosity-flag = "3.0"
comfy-table = "8.0"
dialoguer = { version = "0.12", default-features = false }
env_logger = { version = "0.11", default-features = false, features = ["auto-color"] }
log = "0.4"
semver = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "3.1"
which = "8.0"

[dev-dependencies]
insta = "1.43"
tempfile = "3.27"

[profile.release]
strip = true

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/{ version }/{ name }-{ version }-{ target }{ archive-suffix }"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[lints.rust]
unsafe_code = "deny"
deprecated = "warn"
elided_lifetimes_in_paths = "warn"
rust_2021_prelude_collisions = "warn"
semicolon_in_expressions_from_macros = "warn"
trivial_numeric_casts = "warn"
unsafe_op_in_unsafe_fn = "warn"                         # `unsafe_op_in_unsafe_fn` may become the default in future Rust versions: https://github.com/rust-lang/rust/issues/71668
unused_extern_crates = "warn"
unused_import_braces = "warn"
unused_lifetimes = "warn"

[lints.rustdoc]
all = "warn"
missing_crate_level_docs = "warn"

[lints.clippy]
all = "warn"
correctness = "warn"
suspicious = "warn"
style = "warn"
complexity = "warn"
perf = "warn"
pedantic = "warn"
nursery = "warn"

# Additional lints from https://rust-lang.github.io/rust-clippy/master/index.html?groups=restriction
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
assertions_on_result_states = "warn"
create_dir = "warn"
clone_on_ref_ptr = "warn"
expect_used = "warn"
missing_assert_message = "warn"
panic_in_result_fn = "warn"
str_to_string = "warn"
todo = "warn"
unwrap_used = "warn"
unimplemented = "warn"
wildcard_enum_match_arm = "warn"
