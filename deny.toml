[licenses]
version = 2
private = { ignore = true }
confidence-threshold = 0.93
allow = [
    "Apache-2.0",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
]
exceptions = []

[bans]
multiple-versions = "allow"
deny = [
    { name = "cmake", reason = "It has hurt me too much" },
    { name = "openssl-sys", reason = "Use rustls" },
    { name = "openssl", reason = "Use rustls" },
]
